<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <script src="static/mywebscript.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Emotion Detector</h1>
        <div class="mb-3 mt-4">
            <label for="textToAnalyze" class="form-label">Text to analyze:</label>
            <textarea class="form-control" id="textToAnalyze" rows="3"></textarea>
        </div>
        <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <div id="system_response" class="mt-4 fs-5"></div>
    </div>
</body>
</html>
